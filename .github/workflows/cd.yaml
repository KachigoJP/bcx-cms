name: CI with GCP

on:
  push:
    branches:
      - develop
      - main
env:
  GCP_PROJECT_ID: banchanxanh
  GCP_REGION: us-central1
  DEPLOYMENT_NAME: bcx-cms-api
  GKE_CLUSTER: bcx-cluster
  GKE_REGION: us-central1-a

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Determine Image Tag
      id: image_tag
      run: |
        BRANCH_NAME="${{ github.ref_name }}"
        ENVIRONMENT=""

        if [ "$BRANCH_NAME" == "develop" ]; then
          ENVIRONMENT="-dev"
        elif [ "$BRANCH_NAME" == "main" ]; then
          ENVIRONMENT="-prod"
        else
          echo "Unsupported branch: $BRANCH_NAME"
          exit 1  # Fail the workflow if the branch is not supported
        fi

        IMAGE_TAG="${{ github.sha }}${ENVIRONMENT}" #Use sha for each branch
        echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_OUTPUT

    - name: Authenticate to GCP
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
        project_id: ${{ env.GCP_PROJECT_ID }}

    - name: Set up Google Cloud SDK
      uses: google-github-actions/setup-gcloud@v2
      with:
        service_account_key: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
        project_id: ${{ env.GCP_PROJECT_ID }}

    - name: Configure Docker to use the gcloud command-line tool as a credential helper
      run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev

    - name: Build Docker Image and Push to GCP Artifact Registry
      run: |
        BUILD_IMAGE= ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/banchanxanh/${{ github.repository }}:${{ steps.image_tag.outputs.IMAGE_TAG }}
        echo "Building image: $BUILD_IMAGE"  # Debugging
        docker buildx create --use
        docker buildx build --push -t BUILD_IMAGE . --file Dockerfile

