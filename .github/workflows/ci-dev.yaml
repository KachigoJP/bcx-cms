name: CI with GCP

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop
env:
  GCP_PROJECT_ID: banchanxanh
  GCP_REGION: us-central1
  GAR_REPOSITORY: banchanxanh
  IMAGE_NAME: bcx-cms-api-dev
  IMAGE_TAG: latest
  GKE_CLUSTER: bcx-cluster
  GKE_REGION: us-central1-a

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # Step 1: Checkout the code
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Authenticate to GCP
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
        project_id: ${{ env.GCP_PROJECT_ID }}

    - name: Set up Google Cloud SDK
      uses: google-github-actions/setup-gcloud@v2
      with:
        service_account_key: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
        project_id: ${{ env.GCP_PROJECT_ID }}

    - name: Configure Docker to use the gcloud command-line tool as a credential helper
      run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev

    # - name: Build Docker Image and Push to GCP Artifact Registry
    #   run: |
    #     docker buildx create --use
    #     docker buildx build --push \
    #       -t ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} \
    #       . --file Dockerfile_dev

    # - name: Remove old images with the same tag
    #   run: |
    #     gcloud artifacts docker images list ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} \
    #       --format="get(digest)" | tail -n +2 | while read digest; do
    #       gcloud artifacts docker images delete ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/${{ env.IMAGE_NAME }}@\$digest --quiet;
    #     done

    - name: Set up GKE credentials
      uses: google-github-actions/get-gke-credentials@v2
      with:
        cluster_name: ${{ env.GKE_CLUSTER }}
        location: ${{ env.GKE_REGION }}
        project_id: ${{ env.GCP_PROJECT_ID }}

    # Step 3: Configure kubeconfig
    # - name: Run Kubernetes config
    #   run: |
    #     kubectl apply -f ./kubernetes/

    # Step 4: Create Kubernetes Secret
    - name: Create Kubernetes Secret
      run: |
        kubectl create secret generic bcx-cms-api-dev-secret \
          --from-literal=POSTGRESQL_PASSWORD="\${{ secrets.DEV_POSTGRESQL_PASSWORD }}" \
          --from-literal=JWT_SECRET="\${{ secrets.DEV_JWT_SECRET }}" \
          --namespace default --dry-run=client -o yaml | kubectl apply -f -
    
    - name: Deploy to GKE
      run: |
        kubectl set image deployment/bcx-cms-api-dev \
        bcx-cms-api-dev=${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
    
    - name: Deploy to GKE
      run: kubectl rollout restart deployment bcx-cms-api-dev

    - name: Wait for Deployment Rollout
      run: |
        kubectl rollout status deployment/bcx-cms-api-dev --timeout=120s