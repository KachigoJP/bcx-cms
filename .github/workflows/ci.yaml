name: CI with GCP

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # Step 1: Checkout the code
    - name: Checkout code
      uses: actions/checkout@v3
      run: docker build . --file Dockerfile_prod --tag us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/banchanxanh/bcx-cms-api:latest

    # Step 2: Set up Google Cloud SDK
    - name: Set up Google Cloud SDK
      uses: google-github-actions/setup-gcloud@v1
      with:
        version: 'latest'
        service_account_key: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
        project_id: banchanxanh

    # Step 3: Authenticate with GCP
    - name: Authenticate with GCP
      run: gcloud auth activate-service-account --key-file=${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}

    # - name: Push Docker image to GCP
    #     run: docker push us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/banchanxanh/bcx-cms-api:latest